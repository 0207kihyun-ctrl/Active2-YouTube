<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Active2 YouTube Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="heading">YouTube 테스트</div>
    <div class="entry">
      <input id="videoId" type="text" autocomplete="off" placeholder="영상 ID 또는 링크">
      <button id="load">재생</button>
    </div>
    <div id="stage" aria-label="16:9 video area">
      <div id="zoomLayer">
        <iframe id="player"
          src="about:blank"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
    </div>
    <div class="controls">
      <button id="minus" aria-label="축소">−</button>
      <button id="reset">원래 크기</button>
      <button id="plus" aria-label="확대">＋</button>
    </div>
    <div id="status">일반 영상 링크나 영상 ID를 넣어 주세요.</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
